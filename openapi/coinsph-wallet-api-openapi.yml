  /openapi/wallet/v1/withdraw/address-whitelist:
    get:
      tags:
      - Wallet
      summary: Withdraw Address Whitelist (USER_DATA)
      description: 'Get the withdrawal address whitelist for the authenticated user. Returns all whitelisted

        withdrawal addresses configured for the account, with optional filtering by coin, network,

        or specific address.


        **Key Notes**


        - Returns addresses saved in the account''s withdrawal address whitelist.

        - The coin/network/address/addressTag combination **must** be in the whitelist before a withdrawal can be submitted.

        - Use the `coin`, `network`, or `address` filters to narrow results.


        ---


        ## Additional Info


        **Rate Limit** [📖 Learn More](https://api.docs.coins.ph/reference/general#api-limit-introduction)


        Weight: 1


        **Use Cases** [🧩 SDK](https://api.docs.coins.ph/reference/general#sdk)


        - **Pre-Withdrawal Verification** — Confirm that the target address is whitelisted before submitting a withdrawal request.


        **Best Practices**


        - Use the `coin` filter to retrieve only relevant addresses and reduce response payload size.

        - Always verify addresses are whitelisted before attempting withdrawals to avoid rejections.

        - Cache the whitelist response temporarily (5-10 minutes) and refresh after adding or removing addresses

        '
      operationId: get_withdraw_address_whitelist
      parameters:
      - in: header
        name: X-COINS-APIKEY
        required: true
        schema:
          type: string
        description: API key for authentication.
      - in: query
        name: coin
        required: false
        schema:
          type: string
          example: TRX
        description: Filter by coin symbol.
      - in: query
        name: network
        required: false
        schema:
          type: string
          example: TRX
        description: Filter by network identifier.
      - in: query
        name: address
        required: false
        schema:
          type: string
          example: TYDzsYUEpvnYmQk4zGP9sWWcTEd2MiAtW6
        description: Filter by specific withdrawal address.
      - in: query
        name: recvWindow
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 60000
          example: 5000
        description: 'Request validity window in milliseconds. Default: 5000, Maximum: 60000.'
      - in: query
        name: timestamp
        required: true
        schema:
          type: integer
          format: int64
          minimum: 0
          example: 1638253478000
        description: Unix timestamp in milliseconds.
      - in: query
        name: signature
        required: true
        schema:
          type: string
        description: HMAC SHA256 signature of the query string [📖 Learn More](https://api.docs.coins.ph/reference/general#signed-endpoint-examples-for-post-openapiv1order)
