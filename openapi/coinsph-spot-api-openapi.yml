      - lang: Shell
        label: Transaction History
        source: 'curl --get --location ''https://api.pro.coins.ph/openapi/v1/asset/transaction/history'' \

          --header ''X-COINS-APIKEY: <your api key>'' \

          --data-urlencode ''tokenId=BTC'' \

          --data-urlencode ''pageNum=1'' \

          --data-urlencode ''pageSize=20'' \

          --data-urlencode ''timestamp=1507725176532'' \

          --data-urlencode ''signature=<calculated_signature>''

          '
