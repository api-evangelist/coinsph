  /openapi/v1/asset/transaction/history:
    get:
      tags:
      - Spot
      summary: Transaction History (USER_DATA)
      description: "Get historical fund flow records (transaction history) for a specific token on the account.\nThis endpoint returns all balance changes including deposits, withdrawals, trades, fees,\ntransfers, and other fund movements — providing a complete audit trail of asset changes.\n\n**Key Notes**\n\n- `tokenId` is required — specifies which asset's transaction history to retrieve.\n- Supports pagination via `pageNum` and `pageSize`.\n- Only data from the **last 90 days** is available. \n- `startTime` and `endTime` filter by transaction time; their range cannot exceed 90 days.\n- `endTime` must be greater than `startTime`.\n- Maximum `pageSize` is 100; maximum `pageNum` is 1000.\n- Optionally filter by `subUserId` to view a sub-account's transaction history.\n\n**Difference from Account Trade List**\n\n- Account Trade List (`/openapi/v1/myTrades`): Returns only trade fills (buy/sell executions).\n- This endpoint: Returns all types of fund movements including deposits, withdrawals, trades, fees, transfers, dividends, and other balance changes.\n\n---\n\n## Additional Info\n\n**Rate Limit** [\U0001F4D6 Learn More](https://api.docs.coins.ph/reference/general#api-limit-introduction)\n\nWeight: 5\n\n**Use Cases** [\U0001F9E9 SDK](https://api.docs.coins.ph/reference/general#sdk)\n\n- **Fund Reconciliation** — Track all balance changes for a specific asset across all activity types.\n- **Audit Trail** — Generate a complete history of fund movements for compliance or accounting.\n- **Sub-Account Monitoring** — View transaction history for specific sub-accounts.\n- **Balance Verification** — Cross-reference fund flows against expected balance changes.\n\n**Best Practices**\n\n- Use `startTime` / `endTime` to limit results to a specific time window for faster queries.\n- Paginate through large result sets using `pageNum` incrementally.\n- Keep `pageSize` at a reasonable value (e.g., 50-100) to balance response time and data volume.\n- Use in conjunction with Account Trade List for a complete picture: trades + other fund movements.\n"
      operationId: get_transaction_history
      parameters:
      - in: header
        name: X-COINS-APIKEY
        required: true
        schema:
          type: string
        description: API key for authentication.
      - in: query
        name: tokenId
        required: true
        schema:
          type: string
        description: Token/asset identifier (e.g., BTC, USDT, PHP).
        example: BTC
      - in: query
        name: subUserId
        required: false
        schema:
          type: integer
          format: int64
        description: Sub-account user ID. If provided, returns transaction history for the specified sub-account.
        example: 1234567890
      - in: query
        name: pageNum
        required: false
        schema:
          type: integer
          default: 1
          maximum: 1000
        description: 'Page number for pagination. Default: 1, Maximum: 1000.'
        example: 1
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
        description: 'Number of records per page. Default: 20, Maximum: 100.'
        example: 20
      - in: query
        name: startTime
        required: false
        schema:
          type: integer
          format: int64
        description: Start time filter in milliseconds. Time range with endTime cannot exceed 90 days.
        example: 1657126000000
      - in: query
        name: endTime
        required: false
        schema:
          type: integer
          format: int64
        description: End time filter in milliseconds. Must be greater than startTime.
        example: 1657730000000
      - in: query
        name: recvWindow
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 60000
        description: 'Request validity window in milliseconds. Default: 5000, Maximum: 60000.'
      - in: query
        name: timestamp
        required: true
        schema:
          type: integer
          format: int64
          minimum: 0
        description: Unix timestamp in milliseconds.
        example: 1507725176532
      - in: query
        name: signature
        required: true
        schema:
          type: string
        description: HMAC SHA256 signature of the query string [📖 Learn More](https://api.docs.coins.ph/reference/general#signed-endpoint-examples-for-post-openapiv1order)
