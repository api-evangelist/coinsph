          --data-urlencode ''pageNum=1'' \

          --data-urlencode ''pageSize=50'' \

          --data-urlencode ''timestamp=1507725176532'' \

          --data-urlencode ''signature=<calculated_signature>''

          '
      responses:
        '200':
          description: Transaction history retrieved successfully.
          content:
            application/json:
              schema:
                type: object
