  /openapi/v1/order/cancelReplace:
    post:
      tags:
      - Spot
      summary: Cancel and Replace Order (TRADE)
      description: 'Cancel an existing active order and place a new order on the same symbol in a single atomic operation.

        If the cancellation or new order placement fails, the entire operation is rolled back.


        This endpoint is used to modify parameters (such as quantity, price) of an existing open order

        by cancelling it and immediately placing a replacement order.


        **Cancel Replace Mode**


        | Mode | Description |

        |---|---|

        | STOP_ON_FAILURE | If the cancel request fails, the new order placement will not be attempted |

        | ALLOW_FAILURE | New order placement will be attempted even if the cancel request fails |


        **Cancel Restrictions**


        | Restriction | Description |

        |---|---|

        | ONLY_NEW | Cancel will succeed only if the order status is NEW |

        | ONLY_PARTIALLY_FILLED | Cancel will succeed only if the order status is PARTIALLY_FILLED |


        **Order Type Requirements**


        | Type | Required Additional Parameters |

        |---|---|

        | LIMIT | timeInForce, quantity, price |

        | MARKET | quantity OR quoteOrderQty |

        | STOP_LOSS | quantity OR quoteOrderQty, stopPrice |

        | STOP_LOSS_LIMIT | timeInForce, quantity, price, stopPrice |

        | TAKE_PROFIT | quantity OR quoteOrderQty, stopPrice |

        | TAKE_PROFIT_LIMIT | timeInForce, quantity, price, stopPrice |

        | LIMIT_MAKER | quantity, price |


        **Key Notes**


        - Either `cancelOrderId` or `cancelOrigClientOrderId` must be sent to identify the order to cancel.

        - If both `cancelOrderId` and `cancelOrigClientOrderId` are provided, `cancelOrderId` takes precedence.

        - `newClientOrderId` will replace `clientOrderId` of the cancelled order, freeing it up for new orders.

        - The new order placed may trigger an immediate fill if conditions are met.


        ---


        ## Additional Info


        **Rate Limit** [📖 Learn More](https://api.docs.coins.ph/reference/general#api-limit-introduction)


        Weight: 1


        **Use Cases** [🧩 SDK](https://api.docs.coins.ph/reference/general#sdk)


        - **Price Adjustment** — Modify the price of an existing limit order without missing fills between cancel and new order

        - **Quantity Adjustment** — Change the size of an existing order atomically

        - **Order Upgrade** — Change order type (e.g., from LIMIT to STOP_LOSS_LIMIT) while maintaining position in queue


        **Best Practices**


        - Use `STOP_ON_FAILURE` mode when you want to ensure the old order is cancelled before placing the new one

        - Use `ALLOW_FAILURE` mode when placing the new order is more important than cancelling the old one

        - Always provide `newClientOrderId` for tracking and idempotency

        - Check response `cancelResult` and `newOrderResult` fields to verify both operations succeeded

        '
      operationId: cancel_replace_order
      parameters:
      - in: header
        name: X-COINS-APIKEY
        required: true
        schema:
          type: string
        description: API key for authentication.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - symbol
              - side
              - type
              - cancelReplaceMode
              - timestamp
              - signature
              properties:
                symbol:
                  type: string
                  default: BTCPHP
                  description: Trading pair symbol (e.g., BTCPHP, ETHUSDT).
                side:
                  type: string
                  enum:
                  - BUY
                  - SELL
                  example: BUY
                  description: Order side.
                type:
                  type: string
                  enum:
                  - LIMIT
                  - MARKET
                  - STOP_LOSS
                  - STOP_LOSS_LIMIT
                  - TAKE_PROFIT
                  - TAKE_PROFIT_LIMIT
                  - LIMIT_MAKER
                  example: LIMIT
                  description: Order type for the new replacement order.
                cancelReplaceMode:
                  type: string
                  enum:
                  - STOP_ON_FAILURE
                  - ALLOW_FAILURE
                  example: STOP_ON_FAILURE
                  description: 'Mode controlling behavior when cancel fails. STOP_ON_FAILURE: abort if cancel fails. ALLOW_FAILURE: proceed with new order even if cancel fails.'
                timeInForce:
                  type: string
                  enum:
                  - GTC
                  - IOC
                  - FOK
                  example: GTC
                  description: Time in force policy. Required for LIMIT order types.
                quantity:
                  type: string
                  example: '1'
                  description: Order quantity in base asset units.
                quoteOrderQty:
                  type: string
                  example: '400'
                  description: Order quantity in quote asset units. Used for MARKET orders as alternative to quantity.
                price:
                  type: string
                  example: '50000'
                  description: Limit price for the new order. Required for LIMIT, STOP_LOSS_LIMIT, TAKE_PROFIT_LIMIT, LIMIT_MAKER.
                cancelOrderId:
                  type: integer
                  format: int64
                  example: 1202289462787244800
                  description: System-assigned order ID of the order to cancel.
                cancelOrigClientOrderId:
                  type: string
                  example: my_order_001
                  description: Client-assigned order ID of the order to cancel. Used as alternative to cancelOrderId.
                newClientOrderId:
                  type: string
                  maxLength: 100
                  example: my_new_order_001
                  description: Client-assigned unique ID for the new replacement order. Auto-generated if not provided.
                stopPrice:
                  type: string
                  example: '49000'
                  description: Trigger price for conditional orders (STOP_LOSS, STOP_LOSS_LIMIT, TAKE_PROFIT, TAKE_PROFIT_LIMIT).
                newOrderRespType:
                  type: string
                  enum:
                  - ACK
                  - RESULT
                  - FULL
                  example: FULL
                  description: 'Response detail level. Default: FULL for MARKET/LIMIT, ACK for others.'
                stpFlag:
                  type: string
                  enum:
                  - CB
                  - CO
                  - CN
                  - NONE
                  example: CB
                  description: 'Self-Trade Prevention flag. Default: CB.'
                cancelRestrictions:
                  type: string
                  enum:
                  - ALL
                  - ONLY_NEW
                  - ONLY_PARTIALLY_FILLED
                  example: ONLY_NEW
                  description: 'Restrict cancel by order status. Default: ALL (cancel any status). ONLY_NEW: cancel only if status is NEW. ONLY_PARTIALLY_FILLED: cancel only if status is PARTIALLY_FILLED.'
                recvWindow:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 60000
                  example: 5000
                  description: 'Request validity window in milliseconds. Default: 5000, Maximum: 60000.'
                timestamp:
                  type: integer
                  format: int64
                  example: 1656900365976
                  description: Unix timestamp in milliseconds.
                signature:
                  type: string
                  example: c8db56825ae71d6d79447849e617115f4a920fa2acdcab2b053c4b2838bd6b71
                  description: HMAC SHA256 signature of the query string [📖 Learn More](https://api.docs.coins.ph/reference/general#signed-endpoint-examples-for-post-openapiv1order)
      x-codeSamples:
      - lang: Shell
        label: Cancel and Replace LIMIT Order
        source: 'curl --location --request POST ''https://api.pro.coins.ph/openapi/v1/order/cancelReplace'' \

          --header ''X-COINS-APIKEY: <your api key>'' \

          --data-urlencode ''symbol=BTCPHP'' \

          --data-urlencode ''side=BUY'' \

          --data-urlencode ''type=LIMIT'' \

          --data-urlencode ''cancelReplaceMode=STOP_ON_FAILURE'' \

          --data-urlencode ''timeInForce=GTC'' \

          --data-urlencode ''quantity=0.001'' \

          --data-urlencode ''price=50000'' \

          --data-urlencode ''cancelOrderId=1202289462787244800'' \

          --data-urlencode ''newClientOrderId=my_new_order_001'' \

          --data-urlencode ''timestamp=1656900365976'' \

          --data-urlencode ''signature=<calculated_signature>''

          '
      responses:
        '200':
          description: Cancel and replace operation completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelResult:
                    type: string
                    description: 'Result of the cancel operation: SUCCESS or FAILURE.'
                    example: SUCCESS
                  newOrderResult:
                    type: string
                    description: 'Result of the new order placement: SUCCESS or NOT_ATTEMPTED.'
                    example: SUCCESS
                  cancelResponse:
                    type: object
                    description: Details of the cancelled order.
                    properties:
                      symbol:
                        type: string
                        example: BTCPHP
                      orderId:
                        type: integer
                        format: int64
                        example: 1202289462787244800
                      clientOrderId:
                        type: string
                        example: my_order_001
                      price:
                        type: string
                        example: '48000'
                      origQty:
                        type: string
                        example: '0.001'
                      executedQty:
                        type: string
                        example: '0'
                      cummulativeQuoteQty:
                        type: string
                        example: '0'
                      status:
                        type: string
                        example: CANCELED
                      timeInForce:
                        type: string
                        example: GTC
                      type:
                        type: string
                        example: LIMIT
                      side:
                        type: string
                        example: BUY
                  newOrderResponse:
                    type: object
                    description: Details of the newly placed order.
                    properties:
                      symbol:
                        type: string
                        example: BTCPHP
                      orderId:
                        type: integer
                        format: int64
                        example: 1202289462787244800
                      clientOrderId:
                        type: string
                        example: my_new_order_001
                      transactTime:
                        type: integer
                        format: int64
                        example: 1656900365976
                      price:
                        type: string
                        example: '50000'
                      origQty:
                        type: string
                        example: '0.001'
                      executedQty:
                        type: string
                        example: '0'
                      cummulativeQuoteQty:
                        type: string
                        example: '0'
                      status:
                        type: string
                        example: NEW
                      timeInForce:
                        type: string
                        example: GTC
                      type:
                        type: string
                        example: LIMIT
                      side:
                        type: string
                        example: BUY
              examples:
                success:
                  summary: Successful Cancel and Replace
                  value:
                    cancelResult: SUCCESS
                    newOrderResult: SUCCESS
                    cancelResponse:
                      symbol: BTCPHP
                      orderId: 1202289462787244800
                      clientOrderId: my_order_001
                      price: '48000'
                      origQty: '0.001'
                      executedQty: '0'
                      cummulativeQuoteQty: '0'
                      status: CANCELED
                      timeInForce: GTC
                      type: LIMIT
                      side: BUY
                    newOrderResponse:
                      symbol: BTCPHP
                      orderId: 1202289462787244800
                      clientOrderId: my_new_order_001
                      transactTime: 1656900365976
                      price: '50000'
                      origQty: '0.001'
                      executedQty: '0'
                      cummulativeQuoteQty: '0'
                      status: NEW
                      timeInForce: GTC
                      type: LIMIT
                      side: BUY
        default:
          description: 'API error response. The `code` field contains the internal API error code (not an HTTP status code).


            | Code | Description |

            |---|---|

            | -2011 | Unknown order sent (cancel target not found) |

            | -2013 | Order does not exist |

            | -1013 | Filter failure: PRICE_FILTER or LOT_SIZE |

            | -1116 | Invalid orderType |

            | -2010 | New order rejected |


            For the full list of error codes, see [Error Codes](https://api.docs.coins.ph/reference/error-codes).

            '
  /openapi/v1/historyOrders:
    get:
      tags:
      - Spot
      summary: History Orders By Create Time (USER_DATA)
      description: 'Get all historical orders of the account filtered by order **create time**: cancelled, filled, or rejected.

        Retrieves historical orders for a specific symbol with pagination support

        via the `orderId` parameter and time-based filtering based on when the order was originally created.


        **Key Notes**


        - If `symbol` is omitted, returns historical orders for all symbols (weight: 40).

        - If `orderId` is set, returns orders with order ID >= this value (pagination).

        - `startTime` and `endTime` filter by order create time (the `time` field).

        - Default limit is 500; maximum is 1000.

        - Only data from the **last 90 days** is available.


        This endpoint returns only **closed** orders. Returned statuses: FILLED, CANCELED, REJECTED, EXPIRED.

        Open orders (NEW, PARTIALLY_FILLED) are not returned — use the Current Open Orders endpoint for those.


        **Time Filtering**


        - This endpoint filters orders by their **create time** (`time` field), i.e., the timestamp when the order was originally submitted to the exchange.

        - If you need to filter by the time an order was last updated (filled, cancelled, etc.), use the [History Orders By Update Time](/openapi/v1/getHistoryOrdersByUpdateTime) endpoint instead.


        ---


        ## Additional Info


        **Rate Limit** [📖 Learn More](https://api.docs.coins.ph/reference/general#api-limit-introduction)


        | Condition | Weight |

        |---|---|

        | With symbol | 10 |

        | Without symbol | 40 |


        **Use Cases** [🧩 SDK](https://api.docs.coins.ph/reference/general#sdk)


        - **Trade History** — Retrieve complete order history for reconciliation based on when orders were placed

        - **Audit** — Verify all orders placed (created) during a specific time period

