aid: coinsph
name: Coins.ph
description: Coins.ph is a BSP-regulated Philippine fintech super app combining a licensed crypto exchange
  (Coins Pro), an e-wallet for pesos and 170+ cryptocurrencies, and a merchant/partner payments platform.
  Its public developer platform exposes a Partner Integration / Payment API (QRPH collections, checkout,
  disbursements, refunds, virtual accounts, reconciliation) and the Coins Pro exchange API (spot trading,
  wallets, market data, convert, sub-accounts, and a WebSocket user-data stream), plus an on/off ramp
  API. All requests are authenticated with an API key and HMAC-SHA256 request signing (X-COINS-APIKEY,
  Timestamp, Signature). Backed by Pantera Capital and Ribbit Capital.
